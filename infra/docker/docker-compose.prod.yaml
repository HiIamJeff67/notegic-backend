services:
  notegic-redis:
    container_name: ${DOCKER_REDIS_SERVICE_NAME}
    # restart: always
    image: redis:7.2.3-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  notegic-db:
    # should be the same as CORE_DB_HOST(hosting service)
    container_name: ${DOCKER_DB_SERVICE_NAME}
    # restart: always
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_ADMIN_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_ADMIN_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notegic-notification-db:
    container_name: ${DOCKER_NOTIFICATION_DB_SERVICE_NAME:-notegic-notification-db}
    image: postgres:16
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_ADMIN_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_ADMIN_PASSWORD}
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_ADMIN_USER} -d ${NOTIFICATION_DB_ADMIN_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LGTM stack: keep telemetry storage private to the Compose network.
  notegic-loki:
    container_name: ${DOCKER_LOKI_SERVICE_NAME:-notegic-loki}
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki.yaml", "-config.expand-env=true"]
    environment:
      DOCKER_LOKI_PORT: ${DOCKER_LOKI_PORT:-3100}
    expose:
      - "${DOCKER_LOKI_PORT:-3100}"
    volumes:
      - ../../infra/monitor/loki-config.dev.yaml:/etc/loki.yaml:ro
      - loki-data:/loki

  notegic-mimir:
    container_name: ${DOCKER_MIMIR_SERVICE_NAME:-notegic-mimir}
    image: grafana/mimir:latest
    command:
      ["-config.file=/etc/mimir.yaml", "-target=all,alertmanager", "-config.expand-env=true"]
    environment:
      DOCKER_MIMIR_PORT: ${DOCKER_MIMIR_PORT:-9009}
    expose:
      - "${DOCKER_MIMIR_PORT:-9009}"
    volumes:
      - ../../infra/monitor/mimir-config.dev.yaml:/etc/mimir.yaml:ro
      - ../../infra/monitor/alertmanager-fallback.dev.yaml:/etc/mimir/alertmanager-fallback.yaml:ro
      - ../../infra/monitor/alerts:/etc/mimir/rules/anonymous:ro
      - mimir-data:/data/mimir
    depends_on:
      notegic-mimir-init:
        condition: service_completed_successfully

  notegic-tempo:
    container_name: ${DOCKER_TEMPO_SERVICE_NAME:-notegic-tempo}
    image: grafana/tempo:2.9.1
    command: ["-config.file=/etc/tempo.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_METRICS_CLUSTER: ${TEMPO_METRICS_CLUSTER:-lgtm-production}
      DOCKER_TEMPO_PORT: ${DOCKER_TEMPO_PORT:-3200}
      DOCKER_OTEL_COLLECTOR_GRPC_PORT: ${DOCKER_OTEL_COLLECTOR_GRPC_PORT:-4317}
      DOCKER_OTEL_COLLECTOR_HTTP_PORT: ${DOCKER_OTEL_COLLECTOR_HTTP_PORT:-4318}
      DOCKER_MIMIR_SERVICE_NAME: ${DOCKER_MIMIR_SERVICE_NAME:-notegic-mimir}
      DOCKER_MIMIR_PORT: ${DOCKER_MIMIR_PORT:-9009}
    expose:
      - "${DOCKER_TEMPO_PORT:-3200}"
    volumes:
      - ../../infra/monitor/tempo-config.dev.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      notegic-mimir:
        condition: service_started

  notegic-otel-collector:
    container_name: ${DOCKER_OTEL_COLLECTOR_SERVICE_NAME:-notegic-otel-collector}
    image: otel/opentelemetry-collector-contrib:latest
    environment:
      OTEL_RESOURCE_CLUSTER: ${OTEL_RESOURCE_CLUSTER:-lgtm-production}
      DOCKER_LOKI_SERVICE_NAME: ${DOCKER_LOKI_SERVICE_NAME:-notegic-loki}
      DOCKER_TEMPO_SERVICE_NAME: ${DOCKER_TEMPO_SERVICE_NAME:-notegic-tempo}
      DOCKER_MIMIR_SERVICE_NAME: ${DOCKER_MIMIR_SERVICE_NAME:-notegic-mimir}
      DOCKER_OTEL_COLLECTOR_GRPC_PORT: ${DOCKER_OTEL_COLLECTOR_GRPC_PORT:-4317}
      DOCKER_OTEL_COLLECTOR_HTTP_PORT: ${DOCKER_OTEL_COLLECTOR_HTTP_PORT:-4318}
    expose:
      - "${DOCKER_OTEL_COLLECTOR_GRPC_PORT:-4317}"
      - "${DOCKER_OTEL_COLLECTOR_HTTP_PORT:-4318}"
    volumes:
      - ../../infra/monitor/otel-collector-config.dev.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      notegic-loki:
        condition: service_started
      notegic-mimir:
        condition: service_started
      notegic-tempo:
        condition: service_started

  notegic-grafana:
    container_name: ${DOCKER_GRAFANA_SERVICE_NAME:-notegic-grafana}
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_FEATURE_TOGGLE_ENABLE: ${GF_FEATURE_TOGGLE_ENABLE:-traceqlEditor}
      DOCKER_MIMIR_SERVICE_NAME: ${DOCKER_MIMIR_SERVICE_NAME:-notegic-mimir}
      DOCKER_MIMIR_PORT: ${DOCKER_MIMIR_PORT:-9009}
      DOCKER_TEMPO_SERVICE_NAME: ${DOCKER_TEMPO_SERVICE_NAME:-notegic-tempo}
      DOCKER_TEMPO_PORT: ${DOCKER_TEMPO_PORT:-3200}
      DOCKER_LOKI_SERVICE_NAME: ${DOCKER_LOKI_SERVICE_NAME:-notegic-loki}
      DOCKER_LOKI_PORT: ${DOCKER_LOKI_PORT:-3100}
    ports:
      - "${GRAFANA_PORT:-3000}:${DOCKER_GRAFANA_PORT:-3000}"
    volumes:
      - ../../infra/monitor/grafana/datasources.dev.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../../infra/monitor/grafana/dashboards.dev.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../../infra/monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      notegic-loki:
        condition: service_started
      notegic-tempo:
        condition: service_started
      notegic-mimir:
        condition: service_started

  notegic-client-gateway:
    container_name: ${DOCKER_CLIENT_GATEWAY_SERVICE_NAME:-notegic-client-gateway}
    image: ${CLIENT_GATEWAY_IMAGE:-notegic-client-gateway:latest}
    # restart: always
    build:
      context: ../..
      dockerfile: runtimes/clientgateway/Dockerfile
      target: production
    # entrypoint: ["${ENTRYPOINT_CMD}"]
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      CLIENT_GATEWAY_LISTEN_ADDRESS: 0.0.0.0:${DOCKER_GIN_PORT}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      JWT_ACCESS_TOKEN_SECRET_KEY: ${JWT_ACCESS_TOKEN_SECRET_KEY}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${JWT_REFRESH_TOKEN_SECRET_KEY}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://notegic-core:7778}
      CORE_CLIENT_TIMEOUT: ${CORE_CLIENT_TIMEOUT:-10s}
      NOTIFICATION_BASE_URL: ${NOTIFICATION_BASE_URL:-http://notegic-notification:7781}
      NOTIFICATION_CLIENT_TIMEOUT: ${NOTIFICATION_CLIENT_TIMEOUT:-10s}
      OTEL_SERVICE_NAME: notegic-client-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
    ports:
      - "${GIN_PORT}:${DOCKER_GIN_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${DOCKER_GIN_PORT}/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-core:
        condition: service_healthy
      notegic-notification:
        condition: service_healthy
      notegic-otel-collector:
        condition: service_started

  notegic-api-gateway:
    container_name: ${DOCKER_API_GATEWAY_SERVICE_NAME:-notegic-api-gateway}
    image: ${API_GATEWAY_IMAGE:-notegic-api-gateway:latest}
    build:
      context: ../..
      dockerfile: runtimes/apigateway/Dockerfile
      target: production
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      API_GATEWAY_LISTEN_ADDRESS: 0.0.0.0:${DOCKER_API_GATEWAY_PORT:-7780}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://notegic-core:7778}
      CORE_CLIENT_TIMEOUT: ${CORE_CLIENT_TIMEOUT:-10s}
      OTEL_SERVICE_NAME: notegic-api-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
    ports:
      - "${API_GATEWAY_PORT:-7780}:${DOCKER_API_GATEWAY_PORT:-7780}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${DOCKER_API_GATEWAY_PORT:-7780}/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-core:
        condition: service_healthy
      notegic-redis:
        condition: service_healthy
      notegic-otel-collector:
        condition: service_started

  notegic-core:
    container_name: ${DOCKER_CORE_SERVICE_NAME:-notegic-core}
    image: ${CORE_IMAGE:-notegic-core:latest}
    build:
      context: ../..
      dockerfile: runtimes/core/Dockerfile
      target: production
    volumes:
      - ../../secrets/kafka:/run/secrets/kafka:ro
    environment:
      CORE_DB_HOST: ${CORE_DB_HOST}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      CORE_DB_NAME: ${CORE_DB_NAME}
      CORE_DB_PORT: ${CORE_DB_PORT}
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      CORE_USER_DATA_CACHE_EXPIRES_IN: ${CORE_USER_DATA_CACHE_EXPIRES_IN:-1h}
      CORE_USER_DATA_CACHE_MAX_ROTATION_RETRIES: ${CORE_USER_DATA_CACHE_MAX_ROTATION_RETRIES:-5}
      CORE_QUOTA_CYCLE_WORKER_INTERVAL: ${CORE_QUOTA_CYCLE_WORKER_INTERVAL:-24h}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notegic-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_TLS_CA_FILE: ${KAFKA_TLS_CA_FILE:-/run/secrets/kafka/ca.pem}
      KAFKA_TLS_CERT_FILE: ${KAFKA_TLS_CERT_FILE:-}
      KAFKA_TLS_KEY_FILE: ${KAFKA_TLS_KEY_FILE:-}
      KAFKA_TLS_SERVER_NAME: ${KAFKA_TLS_SERVER_NAME:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      CORE_LISTEN_ADDRESS: 0.0.0.0:7778
      JWT_ACCESS_TOKEN_SECRET_KEY: ${JWT_ACCESS_TOKEN_SECRET_KEY}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${JWT_REFRESH_TOKEN_SECRET_KEY}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      REALTIME_TICKET_PRIVATE_KEY_BASE64: ${REALTIME_TICKET_PRIVATE_KEY_BASE64}
      STORAGE_KEY_SALT: ${STORAGE_KEY_SALT}
      YJS_DOCUMENT_INITIALIZATION_WORKER_URL: ${YJS_DOCUMENT_INITIALIZATION_WORKER_URL:-http://notegic-yjs-worker:8787/core/yjs-document-initialization/v1}
      YJS_DOCUMENT_INITIALIZATION_WORKER_TIMEOUT: ${YJS_DOCUMENT_INITIALIZATION_WORKER_TIMEOUT:-30s}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      OUTBOX_RELAY_POLL_INTERVAL: ${OUTBOX_RELAY_POLL_INTERVAL:-1s}
      OUTBOX_RELAY_CLAIM_TIMEOUT: ${OUTBOX_RELAY_CLAIM_TIMEOUT:-30s}
      OUTBOX_RELAY_INITIAL_BACKOFF: ${OUTBOX_RELAY_INITIAL_BACKOFF:-1s}
      OUTBOX_RELAY_MAXIMUM_BACKOFF: ${OUTBOX_RELAY_MAXIMUM_BACKOFF:-1m}
      OUTBOX_RELAY_RETENTION: ${OUTBOX_RELAY_RETENTION:-168h}
      OUTBOX_RELAY_CLEANUP_INTERVAL: ${OUTBOX_RELAY_CLEANUP_INTERVAL:-1h}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_GOOGLE_REDIRECT_URL: ${OAUTH_GOOGLE_REDIRECT_URL}
      OTEL_SERVICE_NAME: notegic-core
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "7778"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7778/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-db:
        condition: service_healthy
      notegic-yjs-worker:
        condition: service_healthy
      notegic-otel-collector:
        condition: service_started

  notegic-realtime-gateway:
    container_name: ${DOCKER_REALTIME_GATEWAY_SERVICE_NAME:-notegic-realtime-gateway}
    image: ${REALTIME_GATEWAY_IMAGE:-notegic-realtime-gateway:latest}
    build:
      context: ../..
      dockerfile: runtimes/realtimegateway/Dockerfile
      target: production
    volumes:
      - ../../secrets/kafka:/run/secrets/kafka:ro
    environment:
      REDIS_HOST: ${DOCKER_REDIS_SERVICE_NAME}
      REDIS_PORT: ${DOCKER_REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_INIT_DB: ${REDIS_INIT_DB:-0}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notegic-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_TLS_CA_FILE: ${KAFKA_TLS_CA_FILE:-/run/secrets/kafka/ca.pem}
      KAFKA_TLS_CERT_FILE: ${KAFKA_TLS_CERT_FILE:-}
      KAFKA_TLS_KEY_FILE: ${KAFKA_TLS_KEY_FILE:-}
      KAFKA_TLS_SERVER_NAME: ${KAFKA_TLS_SERVER_NAME:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://notegic-core:7778}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      REALTIME_TICKET_PUBLIC_KEY_BASE64: ${REALTIME_TICKET_PUBLIC_KEY_BASE64}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_BETA_USER_PUBLIC_IDS: ${REALTIME_BETA_USER_PUBLIC_IDS:-}
      YJS_WORKER_URLS: ws://notegic-yjs-worker:${DOCKER_YJS_WORKER_PORT:-8787}/core/realtime/v1
      REALTIME_GATEWAY_LISTEN_ADDRESS: ${REALTIME_GATEWAY_LISTEN_ADDRESS:-0.0.0.0:7779}
      GIN_TRUSTED_PROXIES: ${GIN_TRUSTED_PROXIES}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      OTEL_SERVICE_NAME: notegic-realtime-gateway
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "7779"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7779/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-core:
        condition: service_healthy
      notegic-yjs-worker:
        condition: service_healthy
      notegic-otel-collector:
        condition: service_started

  notegic-durable-job:
    container_name: ${DOCKER_DURABLE_JOB_SERVICE_NAME:-notegic-durable-job}
    image: ${DURABLE_JOB_IMAGE:-notegic-durable-job:latest}
    build:
      context: ../..
      dockerfile: runtimes/durablejob/Dockerfile
      target: production
    volumes:
      - ../../secrets/kafka:/run/secrets/kafka:ro
    environment:
      DURABLEJOB_DB_HOST: ${DURABLEJOB_DB_HOST}
      DURABLEJOB_DB_USER: ${DURABLEJOB_DB_USER}
      DURABLEJOB_DB_PASSWORD: ${DURABLEJOB_DB_PASSWORD}
      DURABLEJOB_DB_NAME: ${DURABLEJOB_DB_NAME}
      DURABLEJOB_DB_PORT: ${DURABLEJOB_DB_PORT}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notegic-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_TLS_CA_FILE: ${KAFKA_TLS_CA_FILE:-/run/secrets/kafka/ca.pem}
      KAFKA_TLS_CERT_FILE: ${KAFKA_TLS_CERT_FILE:-}
      KAFKA_TLS_KEY_FILE: ${KAFKA_TLS_KEY_FILE:-}
      KAFKA_TLS_SERVER_NAME: ${KAFKA_TLS_SERVER_NAME:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      DURABLEJOB_LISTEN_ADDRESS: 0.0.0.0:8082
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OTEL_SERVICE_NAME: notegic-durable-job
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-db:
        condition: service_healthy
      notegic-durable-job-database-init:
        condition: service_completed_successfully
      notegic-core:
        condition: service_healthy
      notegic-yjs-worker:
        condition: service_healthy
      notegic-otel-collector:
        condition: service_started

  notegic-notification:
    container_name: ${DOCKER_NOTIFICATION_SERVICE_NAME:-notegic-notification}
    image: ${NOTIFICATION_IMAGE:-notegic-notification:latest}
    build:
      context: ../..
      dockerfile: runtimes/notification/Dockerfile
      target: production
    volumes:
      - ../../secrets/kafka:/run/secrets/kafka:ro
    environment:
      NOTIFICATION_LISTEN_ADDRESS: 0.0.0.0:7781
      NOTIFICATION_DB_HOST: ${NOTIFICATION_DB_HOST}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_PORT: ${NOTIFICATION_DB_PORT}
      CORE_DELEGATION_SECRET: ${CORE_DELEGATION_SECRET}
      CORE_DELEGATION_AUDIENCE: ${CORE_DELEGATION_AUDIENCE}
      CORE_DELEGATION_ISSUER: ${CORE_DELEGATION_ISSUER}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-notegic-kafka:9092}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_TLS_CA_FILE: ${KAFKA_TLS_CA_FILE:-/run/secrets/kafka/ca.pem}
      KAFKA_TLS_CERT_FILE: ${KAFKA_TLS_CERT_FILE:-}
      KAFKA_TLS_KEY_FILE: ${KAFKA_TLS_KEY_FILE:-}
      KAFKA_TLS_SERVER_NAME: ${KAFKA_TLS_SERVER_NAME:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      NOTIFICATION_KAFKA_CONSUMER_GROUP: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:-notegic-notification-core-v1}
      NOTIFICATION_KAFKA_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      NOTIFICATION_KAFKA_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      NOTIFICATION_KAFKA_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      NOTIFICATION_KAFKA_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      NOTIFICATION_OUTBOX_BATCH_SIZE: ${NOTIFICATION_OUTBOX_BATCH_SIZE:-100}
      NOTIFICATION_OUTBOX_POLL_INTERVAL: ${NOTIFICATION_OUTBOX_POLL_INTERVAL:-1s}
      NOTIFICATION_OUTBOX_CLAIM_TIMEOUT: ${NOTIFICATION_OUTBOX_CLAIM_TIMEOUT:-30s}
      NOTIFICATION_OUTBOX_INITIAL_BACKOFF: ${NOTIFICATION_OUTBOX_INITIAL_BACKOFF:-1s}
      NOTIFICATION_OUTBOX_MAXIMUM_BACKOFF: ${NOTIFICATION_OUTBOX_MAXIMUM_BACKOFF:-1m}
      NOTIFICATION_OUTBOX_RETENTION: ${NOTIFICATION_OUTBOX_RETENTION:-168h}
      NOTIFICATION_OUTBOX_CLEANUP_INTERVAL: ${NOTIFICATION_OUTBOX_CLEANUP_INTERVAL:-1h}
      NOTIFICATION_RETENTION: ${NOTIFICATION_RETENTION:-720h}
      OTEL_SERVICE_NAME: notegic-notification
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "7781"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7781/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-notification-db:
        condition: service_healthy
      notegic-notification-database-init:
        condition: service_completed_successfully
      notegic-otel-collector:
        condition: service_started

  notegic-email:
    container_name: ${DOCKER_EMAIL_SERVICE_NAME:-notegic-email}
    image: ${EMAIL_IMAGE:-notegic-email:latest}
    build:
      context: ../..
      dockerfile: runtimes/email/Dockerfile
      target: production
    volumes:
      - ../../secrets/kafka:/run/secrets/kafka:ro
    environment:
      EMAIL_LISTEN_ADDRESS: 0.0.0.0:8081
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      NOTEGIC_OFFICIAL_NAME: ${NOTEGIC_OFFICIAL_NAME}
      NOTEGIC_OFFICIAL_GMAIL: ${NOTEGIC_OFFICIAL_GMAIL}
      NOTEGIC_OFFICIAL_GOOGLE_APPLICATION_PASSWORD: ${NOTEGIC_OFFICIAL_GOOGLE_APPLICATION_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_DIAL_TIMEOUT: ${KAFKA_DIAL_TIMEOUT:-3s}
      KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}
      KAFKA_TLS_CA_FILE: ${KAFKA_TLS_CA_FILE:-/run/secrets/kafka/ca.pem}
      KAFKA_TLS_CERT_FILE: ${KAFKA_TLS_CERT_FILE:-}
      KAFKA_TLS_KEY_FILE: ${KAFKA_TLS_KEY_FILE:-}
      KAFKA_TLS_SERVER_NAME: ${KAFKA_TLS_SERVER_NAME:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      KAFKA_CONSUMER_MAXIMUM_ATTEMPTS: ${KAFKA_CONSUMER_MAXIMUM_ATTEMPTS:-3}
      KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF: ${KAFKA_CONSUMER_INITIAL_RETRY_BACKOFF:-250ms}
      KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF: ${KAFKA_CONSUMER_MAXIMUM_RETRY_BACKOFF:-5s}
      KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS: ${KAFKA_CONSUMER_MAXIMUM_POLL_RECORDS:-100}
      OTEL_SERVICE_NAME: notegic-email
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_GRPC_ENDPOINT: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      notegic-otel-collector:
        condition: service_started
  notegic-yjs-worker:
    image: ${YJS_WORKER_IMAGE:-notegic-yjs-worker:latest}
    build:
      context: ../..
      dockerfile: runtimes/yjsworker/Dockerfile
    environment:
      NODE_ENV: production
      YJS_WORKER_HOST: 0.0.0.0
      YJS_WORKER_PORT: ${DOCKER_YJS_WORKER_PORT:-8787}
      YJS_DB_HOST: ${YJS_DB_HOST:-${CORE_DB_HOST}}
      YJS_DB_PORT: ${YJS_DB_PORT:-${CORE_DB_PORT:-5432}}
      YJS_DB_USER: ${YJS_DB_USER}
      YJS_DB_PASSWORD: ${YJS_DB_PASSWORD}
      YJS_DB_NAME: ${YJS_DB_NAME:-${CORE_DB_NAME}}
      YJS_DB_POOL_MAXIMUM_SIZE: ${YJS_DB_POOL_MAXIMUM_SIZE:-10}
      YJS_DB_POOL_IDLE_TIMEOUT_MILLISECONDS: ${YJS_DB_POOL_IDLE_TIMEOUT_MILLISECONDS:-30000}
      YJS_MAINTENANCE_MAXIMUM_PENDING_HINTS: ${YJS_MAINTENANCE_MAXIMUM_PENDING_HINTS:-1000}
      YJS_MAINTENANCE_MAXIMUM_DISPATCH_BATCH: ${YJS_MAINTENANCE_MAXIMUM_DISPATCH_BATCH:-32}
      YJS_MAINTENANCE_MAXIMUM_DISPATCH_WORKERS: ${YJS_MAINTENANCE_MAXIMUM_DISPATCH_WORKERS:-8}
      YJS_MAINTENANCE_MAXIMUM_REQUEST_ATTEMPTS: ${YJS_MAINTENANCE_MAXIMUM_REQUEST_ATTEMPTS:-3}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_CLIENT_ID: notegic-yjs-worker
      YJS_WORKER_COMMAND_TIMEOUT_MILLISECONDS: ${YJS_WORKER_COMMAND_TIMEOUT_MILLISECONDS:-10000}
      OTEL_SERVICE_NAME: notegic-yjs-worker
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-unknown}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    expose:
      - "${DOCKER_YJS_WORKER_PORT:-8787}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.YJS_WORKER_PORT + '/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 6
    depends_on:
      notegic-core-database-init:
        condition: service_completed_successfully
      notegic-otel-collector:
        condition: service_started

  notegic-nginx:
    image: nginx:1.27-alpine
    container_name: ${DOCKER_NGINX_SERVICE_NAME}
    depends_on:
      notegic-client-gateway:
        condition: service_healthy
      notegic-api-gateway:
        condition: service_healthy
      notegic-realtime-gateway:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT}:${DOCKER_NGINX_HTTP_PORT}"
      - "${NGINX_HTTPS_PORT}:${DOCKER_NGINX_HTTPS_PORT}"
    volumes:
      - ../../infra/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../infra/nginx/ssl:/etc/nginx/ssl:ro

