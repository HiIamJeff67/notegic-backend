    # unmarshal: github.com/HiIamJeff67/notegic-backend/contracts/core/v1/graphql/scalars.UnmarshalUUID
  Time:
    model: "github.com/HiIamJeff67/notegic-backend/contracts/core/v1/graphql/scalars.Time"
