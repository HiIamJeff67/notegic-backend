name: Notegic CI

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/monolith-to-microservices"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notegic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  format-and-vet:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Check formatting
        run: make ci-format
      - name: Run vet for every module
        run: make ci-vet

  unit:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: contracts
            artifact: contracts
          - module: shared
            artifact: shared
          - module: runtimes/cli
            artifact: internal-cli
          - module: runtimes/core
            artifact: internal-core
          - module: runtimes/clientgateway
            artifact: internal-clientgateway
          - module: runtimes/apigateway
            artifact: internal-apigateway
          - module: runtimes/durablejob
            artifact: internal-durablejob
          - module: runtimes/email
            artifact: internal-email
          - module: runtimes/realtimegateway
            artifact: internal-realtimegateway
          - module: runtimes/notification
            artifact: internal-notification
          - module: test
            artifact: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Test module
        working-directory: ${{ matrix.module }}
        run: |
          set -o pipefail
          mkdir -p test-results
          GOWORK=off go test -json -count=1 -coverprofile=coverage.out ./... | tee test-results/go-test.json
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.artifact }}
          path: |
            ${{ matrix.module }}/coverage.out
            ${{ matrix.module }}/test-results/go-test.json
          if-no-files-found: ignore
          retention-days: 14

  race:
    name: Race detector (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: contracts
          - module: shared
          - module: runtimes/core
          - module: runtimes/clientgateway
          - module: runtimes/apigateway
          - module: runtimes/durablejob
          - module: runtimes/email
          - module: runtimes/realtimegateway
          - module: runtimes/notification
          - module: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Run race detector
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go test -race -count=1 ./...

  generated-contracts:
    name: Generated contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: Regenerate GraphQL contracts
        run: make ci-generated

  containers:
    name: Container build (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: clientgateway
            dockerfile: runtimes/clientgateway/Dockerfile
            target: production
          - runtime: apigateway
            dockerfile: runtimes/apigateway/Dockerfile
            target: production
          - runtime: core
            dockerfile: runtimes/core/Dockerfile
            target: production
          - runtime: durablejob
            dockerfile: runtimes/durablejob/Dockerfile
            target: production
          - runtime: email
            dockerfile: runtimes/email/Dockerfile
            target: production
          - runtime: realtimegateway
            dockerfile: runtimes/realtimegateway/Dockerfile
            target: production
          - runtime: notification
            dockerfile: runtimes/notification/Dockerfile
            target: production
          - runtime: yjsworker
            dockerfile: runtimes/yjsworker/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: notegic-ci-${{ matrix.runtime }}:${{ github.sha }}

  publish-images:
    name: Publish tagged images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format-and-vet, unit, race, generated-contracts, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runtime: clientgateway
            dockerfile: runtimes/clientgateway/Dockerfile
            target: production
          - runtime: apigateway
            dockerfile: runtimes/apigateway/Dockerfile
            target: production
          - runtime: core
            dockerfile: runtimes/core/Dockerfile
            target: production
          - runtime: durablejob
            dockerfile: runtimes/durablejob/Dockerfile
            target: production
          - runtime: email
            dockerfile: runtimes/email/Dockerfile
            target: production
          - runtime: realtimegateway
            dockerfile: runtimes/realtimegateway/Dockerfile
            target: production
          - runtime: notification
            dockerfile: runtimes/notification/Dockerfile
            target: production
          - runtime: yjsworker
            dockerfile: runtimes/yjsworker/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize GHCR repository name
        id: image-repository
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "registry=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image-repository.outputs.registry }}/notegic-${{ matrix.runtime }}:${{ github.ref_name }}
