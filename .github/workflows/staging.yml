name: Notegic Staging Delivery

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR tag to deploy (for example v0.4.0 or a commit SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: notegic-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and smoke-test staging
    runs-on: [self-hosted, staging]
    environment: staging
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      COMPOSE_FILE: infra/docker/docker-compose.prod.yaml
      COMPOSE_INIT_FILE: infra/docker/docker-compose.init.prod.yaml
      STAGING_ENCRYPTED_ENV_FILE: /etc/notegic/secrets/envs/.env.staging.enc
      STAGING_SOPS_CONFIG_FILE: /etc/notegic/sops/.sops.yaml
      STAGING_AGE_KEY_FILE: /etc/notegic/sops/age/keys-staging.txt
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt staging environment
        env:
          SOPS_CONFIG_FILE: ${{ env.STAGING_SOPS_CONFIG_FILE }}
          SOPS_AGE_KEY_FILE: ${{ env.STAGING_AGE_KEY_FILE }}
          COMPOSE_ENCRYPTED_ENV_FILE: ${{ env.STAGING_ENCRYPTED_ENV_FILE }}
        run: |
          set -euo pipefail
          command -v sops >/dev/null 2>&1
          test -f "$SOPS_CONFIG_FILE"
          test -f "$SOPS_AGE_KEY_FILE"
          test -f "$COMPOSE_ENCRYPTED_ENV_FILE"
          temporary_env_file="$RUNNER_TEMP/notegic-staging.env"
          sops --config "$SOPS_CONFIG_FILE" decrypt \
            --input-type dotenv \
            --output-type dotenv \
            "$COMPOSE_ENCRYPTED_ENV_FILE" > "$temporary_env_file"
          chmod 600 "$temporary_env_file"
          echo "COMPOSE_ENV_FILE=$temporary_env_file" >> "$GITHUB_ENV"
      - name: Normalize GHCR repository name
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REGISTRY=ghcr.io/${repository}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
      - name: Pull promoted images
        run: make staging-deploy
      - name: Verify staging runtime status
        run: make staging-smoke
      - name: Capture staging logs
        if: always()
        run: |
          if [ -z "${COMPOSE_ENV_FILE:-}" ] || [ ! -f "$COMPOSE_ENV_FILE" ]; then
            echo "No decrypted Compose environment is available; skipping log capture"
            exit 0
          fi
          docker compose --project-directory . --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_INIT_FILE" logs --no-color > staging-compose.log
      - name: Upload staging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-compose-logs-${{ github.run_id }}
          path: staging-compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove decrypted staging environment
        if: always()
        run: rm -f "${RUNNER_TEMP}/notegic-staging.env"
